<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow p-4 w-100" style="max-width: 450px;">

            <h2 class="text-center mb-4">Weather App</h2>
            <div class="input-group mb-3">

                <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">

                <button class="btn btn-primary mx-2" onclick="getWeather()">
                    Search
                </button>

            </div>

            <p id="error" class="text-danger text-center"></p>

            <div id="weather" class="d-none">

                <div class="text-center mb-4">

                    <h4 id="city"></h4>

                    <img id="weatherIcon" alt="Weather icon">

                    <h1 id="temperature"></h1>

                    <p id="description" class="text-secondary text-capitalize"></p>

                    <p id="feelsLike" class="text-secondary"></p>

                </div>

                <div class="row g-3">

                    <div class="col-6">
                        <div class="bg-light rounded p-3 text-center">
                            <p class="text-secondary mb-1">Humidity</p>
                            <h5 id="humidity"></h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="bg-light rounded p-3 text-center">
                            <p class="text-secondary mb-1">Wind Speed</p>
                            <h5 id="wind"></h5>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="bg-light rounded p-3 text-center">
                            <p class="text-secondary mb-1">Visibility</p>
                            <h5 id="visibility"></h5>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
