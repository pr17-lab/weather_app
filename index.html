<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <style>
        body {
        background: url("images/default.jpg") center / cover no-repeat fixed;
        transition: background 0.6s;
    }

    body.clear   { background-image: url("images/clear.jpg"); }
    body.clouds  { background-image: url("images/clouds.jpg"); }
    body.rain    { background-image: url("images/rain.jpg"); }
    body.snow    { background-image: url("images/snow.jpg"); }
    body.thunder { background-image: url("images/thunder.jpg"); }
    body.mist    { background-image: url("images/mist.jpg"); }
    </style>
</head>

<body>

    <div class="container min-vh-100 d-flex justify-content-center align-items-center">

        <div class="card shadow-lg border-0 rounded-4 p-4 w-100 bg-white bg-opacity-50 " style="max-width: 450px; ;">
            <h2 class="text-center mb-4">Weather App</h2>
            <div class="input-group mb-3">
                <input type="text" id="cityInput" class="form-control" placeholder="Enter city name">
                <button id="searchBtn" class="btn btn-primary" onclick="getWeather()">Search</button>
            </div>
            <p id="error" class="text-danger text-center"></p>

            <div id="weather" class="d-none">

                <div class="text-center mb-4">
                    <h4 id="city"></h4>
                    <img id="weatherIcon" alt="Weather icon">
                    <h1 id="temperature" class="display-3 fw-bold"></h1>
                    <p id="description" class="text-dark text-capitalize mb-1"></p>
                    <p id="feelsLike" class="text-dark fw-bold"></p>
                </div>

                <div class="row g-3">

                    <div class="col-6">
                        <div class="bg-light rounded-3 p-3 text-center">
                            <p class="text-secondary mb-1">
                                <i class="fa-solid fa-droplet"></i>
                                 Humidity</p>
                            <h5 id="humidity"></h5>
                        </div>
                    </div>

                    <div class="col-6">
                        <div class="bg-light rounded-3 p-3 text-center">
                            <p class="text-secondary mb-1">
                                <i class="fa-solid fa-wind"></i> 
                                Wind Speed</p>
                            <h5 id="wind"></h5>
                        </div>
                    </div>

                    <div class="col-12">
                        <div class="bg-light rounded-3 p-3 text-center">
                            <p class="text-secondary mb-1">
                                <i class="fa-solid fa-eye"></i>
                                Visibility</p>
                            <h5 id="visibility"></h5>
                        </div>
                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="script.js"></script>
</body>

</html>
